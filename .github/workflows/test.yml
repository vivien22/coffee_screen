# Host tests of the logic (no Arduino needed), static analysis, and the build of the firmware for the Nano
# and its size, on every push and pull request
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test/run.sh
  firmware:
    # The firmware is built for the Nano R4 (the machine) and the journal reader; tools/check_flash.sh shows the flash size
    # and fails over the RAM budget.
    name: firmware (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: machine (Nano R4)
            edit: "true"
          - name: journal reader (tools/journal_dump.cpp)
            edit: "true"
            env: journal_dump
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: ${{ matrix.edit }}
      - run: ./tools/check_flash.sh
        env:
          LABEL: ${{ matrix.name }}
          # the machine unless the entry of the matrix names another environment
          PIO_ENV: ${{ matrix.env }}
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      # Real bugs only (errors, warnings, portability, performance); style findings are not blocking.
      - run: |
          cppcheck --enable=warning,performance,portability --inline-suppr --error-exitcode=1 \
            --suppress=missingInclude --suppress=unusedFunction -DPROGMEM= -I src src
