# Host tests of the logic (no Arduino needed), static analysis, and the build of the firmware for the Nano
# and its size, on every push and pull request
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test/run.sh
  firmware:
    # The firmware is built for the Nano four ways: as configured (the boiler only, the real In flow sensor, the Out one
    # not connected), with the pump and the valve driven, with the Out sensor too, and with the flow simulator (the
    # config lines are uncommented on this runner only). tools/check_flash.sh shows the flash size and fails over the
    # RAM budget.
    name: firmware (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pump driven, valve by hand, In sensor (as configured)
            edit: "true"
          - name: boiler only
            edit: "sed -i 's|^#define DRIVE_PUMP$|// #define DRIVE_PUMP|' src/Config.h"
          - name: pump and valve driven
            edit: "sed -i 's|^// #define DRIVE_VALVE|#define DRIVE_VALVE|' src/Config.h"
          - name: In and Out sensors
            edit: "sed -i 's|^// #define FLOW_OUT_SENSOR|#define FLOW_OUT_SENSOR|' src/Config.h"
          - name: flow simulator
            edit: "sed -i 's|^// #define FLOW_SIMULATOR|#define FLOW_SIMULATOR|' src/Config.h"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: ${{ matrix.edit }}
      - run: ./tools/check_flash.sh
        env:
          LABEL: ${{ matrix.name }}
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      # Real bugs only (errors, warnings, portability, performance); style findings are not blocking.
      # The options are checked with and without: the simulator, the Out sensor, the valve, no pump, and none.
      - run: |
          for d in "-DFLOW_SIMULATOR" "-DFLOW_OUT_SENSOR" "-DDRIVE_VALVE" "-UDRIVE_PUMP" "-UFLOW_SIMULATOR"; do
            cppcheck --enable=warning,performance,portability --inline-suppr --error-exitcode=1 \
              --suppress=missingInclude --suppress=unusedFunction -DPROGMEM= -D__AVR_ATmega328P__ -I src $d src
          done
