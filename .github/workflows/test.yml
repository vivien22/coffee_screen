# Host tests of the logic (no Arduino needed), static analysis, and the build of the firmware for the Nano
# with its flash budget, on every push and pull request
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test/run.sh
  firmware:
    # The firmware is built twice: with the real flow sensors (config.h as it is) and with the flow simulator
    # (switched on on this runner only). tools/check_flash.sh fails over the flash / RAM budget.
    name: firmware (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: real flow sensors
            simulator: false
          - name: flow simulator
            simulator: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - if: matrix.simulator == true
        # Quoted: an unquoted " #" would start a YAML comment and cut the command
        run: "sed -i 's|^// #define FLOW_SIMULATOR|#define FLOW_SIMULATOR|' src/Config.h"
      - run: ./tools/check_flash.sh
        env:
          LABEL: ${{ matrix.name }}
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      # Real bugs only (errors, warnings, portability, performance); style findings are not blocking.
      # FLOW_SIMULATOR is both defined and undefined to check both builds.
      - run: |
          for d in "-DFLOW_SIMULATOR" "-UFLOW_SIMULATOR"; do
            cppcheck --enable=warning,performance,portability --inline-suppr --error-exitcode=1 \
              --suppress=missingInclude --suppress=unusedFunction -DPROGMEM= -D__AVR_ATmega328P__ -I src $d src
          done
