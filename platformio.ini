; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; The machine runs on the Arduino Nano R4 (RA4M1, 256 KB of flash, 32 KB of RAM). The Nano R3 (ATmega328P) version is on the
; branch r3, which is no longer developed.
[env]
framework = arduino
monitor_speed = 115200

build_src_filter = +<*> -<test/> -<tools/> -<docs/> -<.pio/> -<.git/> -<.github/>

lib_deps =
    br3ttb/PID @ ^1.2.1
    adafruit/Adafruit BusIO
    adafruit/Adafruit GFX Library
    adafruit/Adafruit GC9A01A

; The machine. Build it with: pio run   (upload: pio run -t upload)
[env:nano_r4]
platform = renesas-ra
board = nano_r4

; The folder holds an empty wiring_private.h that Adafruit_GC9A01A includes and this core does not have
build_flags = -Isrc/platform/nano_r4

; Erases the journal of the last extractions (EEPROM 24..8191, the journal and the flow curves, the settings are kept) and nothing else (tools/journal_clear.cpp),
; one block of the data flash at a time (settings/Flash.cpp).
; pio run -e journal_clear -t upload, then flash the machine again.
[env:journal_clear]
extends = env:nano_r4
build_src_filter = -<*> +<tools/journal_clear.cpp> +<src/settings/Flash.cpp> +<src/drivers/Perf.cpp>

; A demonstration of the screen, to see the progress arc without making coffee: pio run -e arc_demo -t upload. The screen plays an AUTO extraction
; again and again (pre-infusion, wait, extraction, flush, result), driven by CoffeeMachine::demoExtraction(): the pump and the valve are never
; started. Flash the machine again (pio run -t upload) to go back.
[env:arc_demo]
extends = env:nano_r4
build_flags =
    ${env:nano_r4.build_flags}
    -DARC_DEMO=1

[platformio]
; The project folder is the repository: the sketch (coffee_screen.ino) and its src/ folder are in it
src_dir = .
test_dir = test
; "pio run" without -e builds the machine
default_envs = nano_r4
