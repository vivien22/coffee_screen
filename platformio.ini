; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Settings shared by both boards
[env]
framework = arduino
monitor_speed = 115200

build_src_filter = +<*> -<test/> -<tools/> -<docs/> -<.pio/> -<.git/> -<.github/>

lib_deps =
    br3ttb/PID @ ^1.2.1
    adafruit/Adafruit BusIO
    adafruit/Adafruit GFX Library
    adafruit/Adafruit GC9A01A

; Arduino Nano R3 (ATmega328P): the flags below are AVR only and save about 2 KB of the 30720 B of flash
[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new

build_flags = -flto
              -mcall-prologues
              -fno-ipa-cp
              -mstrict-X
              -fno-gcse
              -fshort-enums

extra_scripts = post:tools/link_flags.py

; Prints the journal of the last extractions (EEPROM) and nothing else, over the serial line at 115200 baud (tools/journal_dump.cpp).
; pio run -e journal_dump -t upload, read the serial line, then flash the machine again (the EEPROM is kept).
[env:journal_dump]
extends = env:nanoatmega328new
build_src_filter = -<*> +<tools/journal_dump.cpp> +<src/settings/Journal.cpp>

; Erases the journal of the last extractions (EEPROM 24..1023, the settings are kept) and nothing else (tools/journal_clear.cpp).
; pio run -e journal_clear -t upload, then flash the machine again.
[env:journal_clear]
extends = env:nanoatmega328new
build_src_filter = -<*> +<tools/journal_clear.cpp>

; Arduino Nano R4 (RA4M1, 256 KB of flash, 32 KB of RAM: no size tricks needed). Build it with: pio run -e nano_r4
[env:nano_r4]
platform = renesas-ra
board = nano_r4

; The folder holds an empty wiring_private.h that Adafruit_GC9A01A includes and this core does not have
; FLOW_LIMIT: the flow limit of the main extraction (test, branch flow_control), see src/coffee/FlowLimit.h
build_flags = -Isrc/platform/nano_r4 -DFLOW_LIMIT=1

[platformio]
; The project folder is the repository: the sketch (coffee_screen.ino) and its src/ folder are in it
src_dir = .
test_dir = test
; "pio run" without -e builds the Nano R3 only (the R4 needs its own platform, downloaded on first use)
default_envs = nanoatmega328new
